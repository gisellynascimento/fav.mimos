<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fav.mimos</title>
    <!-- Link para o CSS externo -->
    <link rel="stylesheet" href="style.css">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-pink-50 text-slate-800 font-sans pb-24">

    <!-- Cabeçalho -->
    <header class="bg-white shadow-sm sticky top-0 z-40">
        <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold text-pink-600 flex items-center gap-2">
                <i class="fa-solid fa-gem"></i> Fav.mimos
            </h1>

            <div class="flex items-center gap-2">
                <!-- Botão Painel Rosa no Topo -->
                <button onclick="abrirPainelAdm()" class="bg-pink-600 hover:bg-pink-700 text-white px-3.5 py-2 rounded-xl text-xs font-bold flex items-center gap-1.5 shadow-sm transition">
                    <i class="fa-solid fa-lock"></i> Painel
                </button>
            </div>
        </div>
    </header>

    <!-- Conteúdo Principal -->
    <main class="max-w-6xl mx-auto px-4 py-8 space-y-4">
        
        <!-- Filtros de Categorias -->
        <div class="flex gap-2 overflow-x-auto pb-2 scrollbar-none">
            <button onclick="filtrarProdutos('todos')" class="filtro-btn active bg-pink-600 text-white px-4 py-2 rounded-full text-sm font-medium shadow-sm transition whitespace-nowrap">Todos</button>
            <button onclick="filtrarProdutos('infantil')" class="filtro-btn bg-white text-slate-600 px-4 py-2 rounded-full text-sm font-medium shadow-sm hover:bg-pink-100 transition whitespace-nowrap">Infantil</button>
            <button onclick="filtrarProdutos('maquiagem')" class="filtro-btn bg-white text-slate-600 px-4 py-2 rounded-full text-sm font-medium shadow-sm hover:bg-pink-100 transition whitespace-nowrap">Maquiagem</button>
            <button onclick="filtrarProdutos('higiene')" class="filtro-btn bg-white text-slate-600 px-4 py-2 rounded-full text-sm font-medium shadow-sm hover:bg-pink-100 transition whitespace-nowrap">Higiene</button>
            <button onclick="filtrarProdutos('hidratante')" class="filtro-btn bg-white text-slate-600 px-4 py-2 rounded-full text-sm font-medium shadow-sm hover:bg-pink-100 transition whitespace-nowrap">Hidratante</button>
            <button onclick="filtrarProdutos('bodysplash')" class="filtro-btn bg-white text-slate-600 px-4 py-2 rounded-full text-sm font-medium shadow-sm hover:bg-pink-100 transition whitespace-nowrap">Body Splash</button>
            <button onclick="filtrarProdutos('relogio')" class="filtro-btn bg-white text-slate-600 px-4 py-2 rounded-full text-sm font-medium shadow-sm hover:bg-pink-100 transition whitespace-nowrap">Relógio</button>
            <button onclick="filtrarProdutos('cabelo')" class="filtro-btn bg-white text-slate-600 px-4 py-2 rounded-full text-sm font-medium shadow-sm hover:bg-pink-100 transition whitespace-nowrap">Cuidados Capilares</button>
            <button onclick="filtrarProdutos('intimo')" class="filtro-btn bg-white text-slate-600 px-4 py-2 rounded-full text-sm font-medium shadow-sm hover:bg-pink-100 transition whitespace-nowrap">Íntimo & Facial</button>
        </div>

        <!-- Todos os Produtos -->
        <div class="py-1">
            <h2 id="titulo-secao" class="text-base font-bold text-slate-800">Todos os Produtos</h2>
        </div>

        <!-- Vitrine de Produtos -->
        <div id="vitrine-produtos" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
            <!-- Injetado via JS -->
        </div>

    </main>

    <!-- Barra Fixa Inferior com itens em Rosa -->
    <div class="fixed bottom-0 left-0 right-0 bg-slate-950/95 border-t border-slate-900 p-2 z-40 backdrop-blur-md">
        <div class="max-w-md mx-auto flex justify-around items-center">
            <button onclick="window.scrollTo({top: 0, behavior: 'smooth'})" class="flex flex-col items-center text-pink-500 py-1 px-4 transition">
                <i class="fa-solid fa-gem text-lg"></i>
                <span class="text-[10px] font-bold mt-1">Catálogo</span>
            </button>
            <button onclick="toggleCarrinho()" class="flex flex-col items-center text-pink-500 py-1 px-4 relative transition">
                <i class="fa-solid fa-cart-shopping text-lg"></i>
                <span class="text-[10px] font-bold mt-1">Carrinho</span>
                <span id="badge-carrinho-inferior" class="absolute -top-1 right-2 bg-pink-600 text-white text-[10px] font-black w-5 h-5 rounded-full flex items-center justify-center border-2 border-slate-950 hidden">0</span>
            </button>
            <button onclick="abrirPainelAdm()" class="flex flex-col items-center text-pink-500 py-1 px-4 transition">
                <i class="fa-solid fa-chart-pie text-lg"></i>
                <span class="text-[10px] font-bold mt-1">Vendas</span>
            </button>
        </div>
    </div>

    <!-- Modal do Carrinho -->
    <div id="modal-carrinho" class="fixed inset-0 bg-black/50 hidden justify-end z-50">
        <div class="bg-white w-full max-w-md h-full p-6 flex flex-col shadow-xl">
            <div class="flex justify-between items-center border-b pb-4">
                <h2 class="text-lg font-bold text-slate-800">Seu Carrinho - Fav.mimos</h2>
                <button onclick="toggleCarrinho()" class="text-slate-400 hover:text-slate-600 text-xl">&times;</button>
            </div>
            
            <div id="lista-carrinho" class="flex-1 overflow-y-auto py-4 space-y-4"></div>

            <div class="border-t pt-4">
                <div class="flex justify-between mb-4 font-bold text-lg">
                    <span>Total:</span>
                    <span id="valor-total" class="text-pink-600">R$ 0,00</span>
                </div>
                <button onclick="finalizarPedido()" class="w-full bg-green-600 text-white py-3 rounded-xl font-semibold shadow hover:bg-green-700 transition flex items-center justify-center gap-2">
                    <i class="fa-brands fa-whatsapp text-xl"></i> Finalizar Pedido via WhatsApp
                </button>
            </div>
        </div>
    </div>

    <!-- Link para o JavaScript externo -->
    <script src="script.js"></script>
</body>
</html>
